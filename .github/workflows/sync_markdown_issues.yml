name: Sync Markdown to Issues

on:
  push:
    paths:
      - '**/*.md'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-markdown-issues
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect changed markdown files
        shell: bash
        run: |
          current_sha="${{ github.sha }}"
          before_sha="${{ github.event.before }}"

          if [[ -z "$before_sha" || "$before_sha" == "0000000000000000000000000000000000000000" ]]; then
            before_sha=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          : > added_modified.txt
          : > deleted.txt

          if [[ -n "$before_sha" ]] && git cat-file -e "$before_sha^{commit}" 2>/dev/null; then
            git diff --diff-filter=AM --name-only "$before_sha" "$current_sha" \
              | grep -E '\.md$' | grep -v '^README\.md$' > added_modified.txt || true
            git diff --diff-filter=D --name-only "$before_sha" "$current_sha" \
              | grep -E '\.md$' | grep -v '^README\.md$' > deleted.txt || true
          else
            find . -name '*.md' -not -path './.git/*' -not -name 'README.md' \
              | sed 's|^\./||' | sort > added_modified.txt
          fi

          echo "== 新增或修改 =="
          cat added_modified.txt
          echo "== 删除 =="
          cat deleted.txt

      - name: Sync issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/sync_issues.py
